{% extends "base.html" %}

{% block title %}Internal Server Error - WaitWise{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4 relative">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(239,68,68,0.03)_0%,transparent_70%)]"></div>
    <div class="relative max-w-md p-8 rounded-2xl glass-card border border-red-950/40 shadow-2xl">
        <div class="text-red-500 text-6xl mb-6">
            <i class="fa-solid fa-server"></i>
        </div>
        <h1 class="text-4xl font-extrabold text-white mb-2">500</h1>
        <h2 class="text-xl font-semibold text-slate-300 mb-4">Internal Server Error</h2>
        <p class="text-slate-400 text-sm mb-8 leading-relaxed">
            Something went wrong on our servers. We've logged this error and are working on fixing it. Please try again later.
        </p>
        <a href="{{ url_for('main.index') }}" class="inline-flex bg-brand-600 hover:bg-brand-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-brand-600/30 items-center space-x-2">
            <i class="fa-solid fa-home"></i>
            <span>Return Home</span>
        </a>
    </div>
</div>
{% endblock %}
